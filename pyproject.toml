[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "full_stack_dev"
version = "0.1.0"

[tool.setuptools]
packages = ["openising"]
package-dir = {"openising" = "tools/openising/openising/ising"}
