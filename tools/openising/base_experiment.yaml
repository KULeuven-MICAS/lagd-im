#################################
## General parameters
#################################

# Benchmark file name
benchmark: ./ising/benchmarks/MIMO/user5_ant5_M16.txt

# Solver to use: [BRIM, SA, DSA, inSituSA, bSB, dSB, SCA, Multiplicative, CIM, all]
solvers:
  - Multiplicative


# Use gurobi or not
use_gurobi: False

# Use multiprocessing or not
use_multiprocessing: False

nb_cores: 16

# Initialization seed or use eigenvector of matrix

eigenvalue_start: False

# Logging or not
gen_logfile: True
logfile_discrimination: None

#################################
## Solvers hyperparameters
#################################


# Parameters for Multiplicative
num_iterations_Multiplicative: 50000
nb_flipping: 512
cluster_threshold: 0.3
init_cluster_size: 0.8
end_cluster_size: 0.0625
exponent: 3.0
cluster_choice: "random"
current: 1.0
capacitance: 1
accumulation_delay: 0.
broadcast_delay: 0.
delay_offset: 0.0
# sigma_J: -1.0
stop_criterion: 1e-6  # 1uV


#################################
## Problems hyperparameters
#################################

# Parameters for TSP
weight_constant: 0

# Parameters for MIMO
SNR: 10
nb_trials: 100
mimo_seed: 12
use_ZF: False
is_hamming_encoding: False

#################################
## Specific Stages hyperparameters
#################################

# Parameters for quantization stage
quantization: True
quantization_precision: 4
scale_h: True
scale_to_integer: True

# Parameters for npmos stage
offset_type: others
offset_ratio: 0.3

# Parameters for noise stage
device_noise: False
noise_level: 0.1

# Parameters for mismatch stage
mismatch_std: 0.0

# Parameters for combine nodes stage
combine_nodes: False
nodes_scaling: 2

#################################
## Dummy creator hyperparameters
#################################
dummy_creator: True